[workspace]
resolver = "3"
members = ["crates/*", "bindings/python-forms", "rust-examples"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-providers"
# Not published yet.
publish = false

[workspace.dependencies]
# RoomKit's Rust core: what a provider is, what it is asked and what it
# answers. A build holds one of each of these crates, the provider's and
# its host's: the revision is the one a host pins. It is past the 0.3.0
# release, whose contract ends a generation in a free word: this one ends
# it in `FinishReason`, which no release holds yet.
roomkit = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "bd1caf0e2bbc57e8aeeb8638cd6fbb2fe1847e96" }
roomkit-ai = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "bd1caf0e2bbc57e8aeeb8638cd6fbb2fe1847e96" }
roomkit-core = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "bd1caf0e2bbc57e8aeeb8638cd6fbb2fe1847e96" }
# What the examples' agents run on beside a provider (rust-examples): the
# SQLite store of the server examples and the MCP tools of one of them.
roomkit-sqlite = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "bd1caf0e2bbc57e8aeeb8638cd6fbb2fe1847e96" }
roomkit-mcp = { version = "0.3.0", git = "https://github.com/roomkit-live/roomkit-rs", rev = "bd1caf0e2bbc57e8aeeb8638cd6fbb2fe1847e96" }
roomkit-providers-http = { version = "0.1.0-alpha.1", path = "crates/roomkit-providers-http" }
roomkit-providers-client = { version = "0.1.0-alpha.1", path = "crates/roomkit-providers-client" }
roomkit-providers-python-forms = { version = "0.1.0-alpha.1", path = "bindings/python-forms" }
# The WebSocket server of the server examples, and the client their checks
# connect with (rust-examples).
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-core = { version = "0.3", default-features = false }
# An HTTP date a server's `retry-after` names.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Where a Unix system that has no certificate verifier of its own keeps its
# authorities: its bundle file and its directories.
openssl-probe = "0.2"
# The authority a test makes for itself and the certificates it signs, made
# when the test runs: no key is kept in the repository.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The HTTP client of the providers. No default feature: no system TLS
# library, no HTTP/2, no proxy from the system's settings and no charset
# support; a crate enables what it needs.
reqwest = { version = "0.13", default-features = false }
# TLS with the ring provider, given to an HTTP client as a whole
# configuration.
rustls = { version = "0.23", default-features = false }
# The certificate verifier of the system, where the system has one: macOS
# and Windows.
rustls-platform-verifier = "0.7"
serde = "1"
serde_json = "1"
thiserror = "2"
# The wait between two tries of a request, and the timeouts of a client.
tokio = { version = "1", default-features = false }
# The TLS of a test's local fake of an endpoint.
tokio-rustls = { version = "0.26", default-features = false }
# What a provider reports of its work: a request tried again, a setting left
# out of a request.
tracing = { version = "0.1", default-features = false }
# The URL parser `reqwest` reads a URL with: the 2.x line, so that a tree
# holds one version of it, the client's.
url = "2.5"
uuid = { version = "1", default-features = false }
# The public web PKI roots a provider's server is checked against where the
# system holds no authority at all.
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Module paths already name the domain, and `#[must_use]` is put where
# ignoring a value is a bug rather than on every pure function.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Library code never panics on input: no unwrap, expect, panic, indexing or
# string slicing outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
# Output goes through the host's logging; examples opt out explicitly.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A silenced lint states why, and `expect` fails once the reason is gone.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Adding a variant to a closed enumeration must force every match to decide.
wildcard_enum_match_arm = "warn"
clone_on_ref_ptr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
bare_urls = "warn"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # The tests run where no network is reachable but loopback, in a
      # network namespace scripts/no-network.sh makes as the runner's user.
      # Ubuntu's AppArmor refuses a user that namespace by default: the
      # restriction is lifted here, for the machine of this job, and the
      # script's own test then fails the job if it still can make none.
      # Nothing sets ROOMKIT_PROVIDERS_ALLOW_NETWORK: no test of CI runs with
      # the network reachable.
      - name: Let the tests make a network namespace
        run: |
          restriction=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$restriction" >/dev/null 2>&1; then
            sudo sysctl -w "$restriction=0"
          fi
          make no-network-test
      - run: make fmt-check clippy test doc

  python:
    name: Python ${{ matrix.python }} wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: python -m pip install 'uv>=0.9,<1'
      # The package depends on RoomKit, in a version that is not released
      # yet: the check installs the one this interpreter has, which comes
      # from RoomKit's repository meanwhile.
      - run: python -m pip install 'roomkit @ git+https://github.com/roomkit-live/roomkit'
      - run: cargo install cargo-deny --locked --version 0.20.2
      # The Python tests and the examples run where no network is reachable
      # but loopback, in a network namespace scripts/no-network.sh makes as
      # the runner's user. Ubuntu's AppArmor refuses a user that namespace by
      # default: the restriction is lifted here, for the machine of this job,
      # and the script's own test then fails the job if it still can make
      # none. Nothing sets ROOMKIT_PROVIDERS_ALLOW_NETWORK: no test of CI
      # runs with the network reachable.
      - name: Let the tests make a network namespace
        run: |
          restriction=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$restriction" >/dev/null 2>&1; then
            sudo sysctl -w "$restriction=0"
          fi
          make no-network-test
      # The binding's lint, docs and dependency policy, the Python lint, then
      # a wheel and a source distribution, each installed beside RoomKit and
      # tested: what every provider shares against a scripted provider, the
      # replay of the recorded cases against a local fake, a RoomKit agent,
      # cancellation, the event loop, the interpreter's exit and the API
      # snapshot.
      - run: make python-check
      - if: matrix.python == '3.12'
        run: make msrv-toolchain python-msrv

  redis:
    name: Turn backend on Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The one job whose tests reach a server: a Redis of the job's own, on
    # the runner's loopback, which a namespace of scripts/no-network.sh
    # cannot reach (CONTRIBUTING.md, "Contracts and tests"). The interop
    # with RoomKit's Python needs a RoomKit checkout and skips itself here:
    # the local gates run it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: make redis-test

  postgres:
    name: Postgres store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Postgres store's tests on a Postgres of the job's own, on the
    # runner's loopback, as the Redis job does. The cross-read with
    # RoomKit's Python needs a RoomKit checkout and skips itself here: the
    # local gates run it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DSN: postgresql://postgres:ci-throwaway@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: make postgres-test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: make msrv-toolchain msrv

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  commits:
    name: Commit messages
    # Dependency update titles are generated; their subject is rewritten
    # when the pull request is squashed.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            # An initial or rewritten history may not contain the previous tip.
            range="$HEAD_SHA"
          fi
          commits=$(git rev-list "$range")
          for commit in $commits; do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh scripts/check-commit-message.sh "$RUNNER_TEMP/message" || exit 1
          done

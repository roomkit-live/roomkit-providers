name: Python distributions

# Build and test artifacts on demand. Nothing is published from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64 distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: python -m pip install 'uv>=0.9,<1'
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          channel = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"channel={channel}", file=output)
          PYTHON
      - name: Build optimized wheel in manylinux
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.16.0"
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          manylinux: "2_34"
          container: quay.io/pypa/manylinux_2_34_x86_64@sha256:834a2a31de5eabacd4411417b3bbc9fcb6ff9f959972711ab3b73355e7b0928d
          args: --locked --release --strip --auditwheel check --interpreter python3.12 --out dist
        env:
          # The paths of the container that builds stay out of the wheel.
          RUSTFLAGS: --remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/io=/roomkit-providers
      - name: Build the source distribution
        run: uv tool run --from 'maturin==1.16.0' maturin sdist --out dist
      - name: Check package metadata and description rendering
        run: uv tool run --from 'twine>=6,<7' twine check --strict dist/*.whl dist/*.tar.gz
      - name: Hash distributions
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  validate:
    name: Install distributions on Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: python -m pip install 'uv>=0.9,<1'
      # The package depends on RoomKit, in a version that is not released
      # yet: the check installs the one this interpreter has, which comes
      # from RoomKit's repository meanwhile.
      - run: python -m pip install 'roomkit @ git+https://github.com/roomkit-live/roomkit'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Check downloaded files
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      # The Python tests and the examples run where no network is reachable
      # but loopback, in a network namespace scripts/no-network.sh makes as
      # the runner's user. Where Ubuntu's AppArmor refuses a user that
      # namespace, the restriction is lifted here, for the machine of this
      # job, and the script's own test then fails the job if it still can
      # make none. Nothing sets ROOMKIT_PROVIDERS_ALLOW_NETWORK: no test of
      # this workflow runs with the network reachable.
      - name: Let the tests make a network namespace
        run: |
          restriction=kernel.apparmor_restrict_unprivileged_userns
          if sysctl -n "$restriction" >/dev/null 2>&1; then
            sudo sysctl -w "$restriction=0"
          fi
          make no-network-test
      - name: Validate both installations
        run: python scripts/check-python.py --wheel dist/roomkit_providers-*.whl --sdist dist/roomkit_providers-*.tar.gz

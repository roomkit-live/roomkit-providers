version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      deps:
        update-types: [minor, patch]
  # The Python binding is a workspace of its own, with its own lock file.
  - package-ecosystem: cargo
    directory: /bindings/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      deps:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: Bug report
description: A provider or a contract does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues privately instead: see SECURITY.md.
        Never paste API keys, private conversations or provider responses.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The provider and its configuration without the key, and the smallest request or program that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha.1, or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Rust version
      placeholder: Ubuntu 24.04, Rust 1.94
    validations:
      required: true

name: Feature request
description: Propose a provider, an option or an integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an application cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like, including what the host should control. For a new provider, link the vendor's API reference.
    validations:
      required: true

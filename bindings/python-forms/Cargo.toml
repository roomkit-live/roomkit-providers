[package]
name = "roomkit-providers-python-forms"
description = "The JSON forms of RoomKit's Python models, read into and written from the types of RoomKit's Rust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# RoomKit's core: the types read and written here.
roomkit = { workspace = true }
roomkit-ai = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# A JSON object keeps its members in the order they were written, as a
# Python dict does, and a number is read as the float nearest to its digits,
# as Python reads it.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true

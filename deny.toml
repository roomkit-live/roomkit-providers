[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT"]
# A license outside the list is allowed for the one crate that needs it.
exceptions = [
    # Behind the derive macros of serde and thiserror, at build time:
    # (MIT OR Apache-2.0) AND Unicode-3.0, for the Unicode data it embeds.
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    # The hasher of serde_json's ordered map (its `preserve_order` feature).
    { crate = "foldhash", allow = ["Zlib"] },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

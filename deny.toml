[graph]
all-features = true

[advisories]
yanked = "deny"
# chrono, unmaintained with no safe version (RUSTSEC-2026-0543), comes only
# through rmcp, the MCP SDK behind roomkit-mcp, which one example's agent
# takes its tools from (rust-examples): no provider depends on it. Ignored
# until rmcp leaves it, as RoomKit's Rust core ignores it.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono, through rmcp only, in the examples; no safe version; until rmcp drops it" },
]

[licenses]
# Unicode-3.0 covers the crates that hold or read Unicode data: the ICU crates
# behind the URL parser, unicode-ident behind the derive macros, and the
# crate of this repository that ships that data's notice (LICENSE-UNICODE):
# the HTTP support crate, for its list of the characters that normalize to
# a URL's delimiter.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# Any other license is allowed for the one crate that needs it.
exceptions = [
    # The hasher of serde_json's ordered map (its `preserve_order` feature).
    { crate = "foldhash", allow = ["Zlib"] },
    # The TLS configuration of roomkit-providers-http: ring, the cryptography
    # of rustls, its certificate checks and the reader ring parses with.
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    # Constant-time comparisons, behind rustls.
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # The router of axum, the WebSocket server of the server examples
    # (rust-examples): no provider depends on it.
    { crate = "matchit", allow = ["BSD-3-Clause"] },
    # The public web PKI roots a server is checked against where the system
    # keeps no authority of its own: certificate data.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # The same data, which the system's certificate verifier, behind
    # roomkit-providers-http and the HTTP client, depends on for WebAssembly
    # targets alone: the lock file lists it, and no target this workspace
    # builds compiles it.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # The Redis client of the turn backend on Redis (roomkit-providers-redis),
    # and the XXH3 hash it requires, at the version it requires: no other
    # crate depends on either.
    { crate = "redis", allow = ["BSD-3-Clause"] },
    { crate = "xxhash-rust@=0.8.21", allow = ["BSL-1.0"] },
    # PyO3's detection of the build's target, in the Python binding's tree
    # alone (`make python-check`): a build script's dependency.
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# RoomKit's Rust core, which is not on crates.io: what a provider is comes
# from it. The Postgres client's temporary cancellation fix
# (rust-postgres/rust-postgres#1409), at a revision.
required-git-spec = "rev"
allow-git = ["https://github.com/roomkit-live/roomkit-rs", "https://github.com/sboily/rust-postgres"]

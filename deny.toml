[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Unicode-3.0 covers the crates that hold or read Unicode data: the ICU crates
# behind the URL parser, unicode-ident behind the derive macros, and the two
# crates of this repository that ship that data's notice (LICENSE-UNICODE):
# the contract crate for its table of printable characters, the HTTP support
# crate for its list of the characters that normalize to a URL's delimiter.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# Any other license is allowed for the one crate that needs it.
exceptions = [
    # The hasher of serde_json's ordered map (its `preserve_order` feature).
    { crate = "foldhash", allow = ["Zlib"] },
    # The TLS configuration of roomkit-providers-http: ring, the cryptography
    # of rustls, its certificate checks and the reader ring parses with.
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    # Constant-time comparisons, behind rustls.
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # The public web PKI roots a server is checked against: certificate data.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # The same data, which the platform verifier of the HTTP client behind
    # roomkit-providers-openai depends on for WebAssembly targets alone: the
    # lock file lists it, and no target this workspace builds compiles it.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # PyO3's detection of the build's target, in the Python binding's tree
    # alone (`make python-check`): a build script's dependency.
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "roomkit-providers-postgres"
description = "A Postgres conversation store, lock manager and knowledge source for RoomKit, on the Python implementation's schema"
version.workspace = true
edition.workspace = true
# The Rust release RoomKit's Rust core supports, which this crate had
# there: a host on that release takes it (make msrv checks it).
rust-version = "1.92"
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["roomkit", "postgres", "store", "conversation"]
categories = ["database"]

[dependencies]
blake2.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
roomkit.workspace = true
roomkit-ai.workspace = true
roomkit-core.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing = { workspace = true, features = ["std"] }
whoami.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# The TLS tests' certificate authority, its servers and its revocation
# lists, generated at each run.
rcgen.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# The cross-read fixture's digest.
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

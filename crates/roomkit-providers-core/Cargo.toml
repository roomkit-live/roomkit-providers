[package]
name = "roomkit-providers-core"
description = "Runtime-independent contracts for model providers: requests, responses, streams and failures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["llm", "ai", "provider", "model", "streaming"]
categories = ["api-bindings"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
# A JSON object keeps its members in the order they were written, as a
# Python dict does.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# The random half of an id minted for a call its server gave none.
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

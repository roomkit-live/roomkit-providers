[package]
name = "roomkit-providers-opentelemetry"
description = "RoomKit's telemetry on OpenTelemetry: the kit's spans and metrics handed to an OpenTelemetry SDK tracer and meter provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/LICENSE", "/README.md", "/examples", "/src", "/tests"]
keywords = ["roomkit", "opentelemetry", "telemetry", "tracing"]
categories = ["development-tools::debugging"]

[dependencies]
# RoomKit's core: the telemetry provider's interface this crate implements,
# and the current span's context it starts its spans under.
roomkit = { workspace = true }
# The API and the SDK the spans and metrics go to.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
# A span attribute's value, as the kit hands it.
serde_json = { workspace = true }
# What the provider logs: a parent it cannot find, an export that fails.
tracing = { workspace = true }

[dev-dependencies]
# The in-memory exporters the tests read.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
pretty_assertions = { workspace = true }
# The rooms of the kit-level tests: an AI channel over a scripted model.
roomkit = { workspace = true }
roomkit-ai = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true

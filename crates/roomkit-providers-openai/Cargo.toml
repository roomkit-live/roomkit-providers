[package]
name = "roomkit-providers-openai"
description = "The OpenAI model provider: Chat Completions, whole and streamed, held to the wire cases of RoomKit's Python provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/LICENSE", "/README.md", "/catalog", "/examples", "/src", "/tests"]
keywords = ["llm", "ai", "provider", "openai", "chat"]
categories = ["api-bindings"]

[features]
# For a replay of recorded cases outside this crate's tests, a binding's:
# a provider's requests are sent to a local fake of its endpoint, its clock
# is set and its waits are kept instead of taken. Not for a host: nothing
# of it shows in the documentation.
replay = []

[dependencies]
# The contract: the request a provider is given, what it answers, and the
# JSON object a configuration's extra body is.
roomkit-providers-llm = { workspace = true }
# The TLS configuration the client is built with.
roomkit-providers-http = { workspace = true }
# An HTTP date a server's `retry-after` names.
jiff = { workspace = true }
# `rustls-no-provider` makes the client take the configuration given it.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The wait between two tries of a request.
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
# The parser the client reads a URL with: named here to hold, at compile
# time, that the client's URL type is this one.
url = { workspace = true }

[dev-dependencies]
# With gzip turned on, as a host's build may turn it on for the same HTTP
# client: the tests hold that the provider still asks for no compressed
# answer.
reqwest = { workspace = true, features = ["gzip"] }
# The trait of the streams a test reads.
futures-core = { workspace = true }
# The fake of the wire the provider is replayed against, and the example's
# stand-in server: local servers.
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync", "test-util"] }

[lints]
workspace = true

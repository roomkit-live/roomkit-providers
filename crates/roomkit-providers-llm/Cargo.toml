[package]
name = "roomkit-providers-llm"
description = "Runtime-independent contracts for model providers: requests, responses, streams and failures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# MIT, and the Unicode License V3 for the tables derived from Unicode data:
# the printable characters (src/python/printable.rs), and what a text from
# outside is read with, look-alikes, classes of characters and canonical
# composition (src/outside/tables/).
license = "MIT AND Unicode-3.0"
repository.workspace = true
publish.workspace = true
readme = "README.md"
# What a published crate carries, both license files by name: the MIT
# license, and the notice of the Unicode data its tables are derived from.
include = ["/LICENSE", "/LICENSE-UNICODE", "/README.md", "/src", "/tests"]
keywords = ["llm", "ai", "provider", "model", "streaming"]
categories = ["api-bindings"]

[dependencies]
# The `Stream` a provider's events and text come as.
futures-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# A JSON object keeps its members in the order they were written, as a
# Python dict does, and a number is read as the float nearest to its digits,
# as Python reads it: the default reading is off by one bit on some numbers
# of 16 or 17 digits.
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
thiserror = { workspace = true }
# The random half of an id minted for a call its server gave none.
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

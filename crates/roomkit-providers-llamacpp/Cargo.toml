[package]
name = "roomkit-providers-llamacpp"
description = "Managed local GGUF inference through llama.cpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
replay = ["roomkit-providers-openai/replay"]

[dependencies]
roomkit-ai.workspace = true
roomkit-providers-openai = { version = "0.1.0-alpha.1", path = "../roomkit-providers-openai" }
roomkit-providers-client.workspace = true
roomkit-providers-http.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["signal"] }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true

[[test]]
name = "managed"
harness = false

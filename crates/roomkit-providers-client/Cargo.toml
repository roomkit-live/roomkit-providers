[package]
name = "roomkit-providers-client"
description = "The HTTP client a model provider is built on: bounded exchanges, retries, the one exit of failures, and the replay of recorded wire cases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["/LICENSE", "/README.md", "/src", "/tests"]
keywords = ["llm", "ai", "provider", "http", "client"]
categories = ["web-programming::http-client"]

[features]
# For a replay of recorded cases outside a provider crate's tests, a
# binding's: a client's clock is set and its waits are kept instead of
# taken, and a provider's requests go to a loopback address. Not for a host.
replay = []
# Test support, for the tests of a provider crate: a local fake of an
# endpoint or of a proxy, over plain HTTP or over TLS with the certificate
# of an authority a test makes for itself, the replay of a fixture of
# recorded cases through it, what the replay compares, its self-test and
# the cases a provider names. It panics where a test fails: never for a
# host.
harness = [
    "dep:futures-core",
    "dep:rcgen",
    "dep:serde",
    "dep:tokio-rustls",
    "rustls/ring",
    "rustls/std",
    "rustls/tls12",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/test-util",
]

[dependencies]
# The contract: the failure a provider answers with, the events of a stream,
# and, for the harness, what a provider is asked and gives.
roomkit-providers-llm = { workspace = true }
# The TLS configuration the client is built with, and the bounded reader of
# a stream's events.
roomkit-providers-http = { workspace = true }
# The stream of a provider's items, which the harness reads.
futures-core = { workspace = true, optional = true }
# An HTTP date a server's `retry-after` names.
jiff = { workspace = true }
# The authority a test makes for itself, and the certificates it signs for
# the harness's fakes.
rcgen = { workspace = true, optional = true }
# `rustls-no-provider` makes the client take the configuration given it.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
# The TLS configuration the HTTP client is given, by its type; and, for the
# harness, the TLS of a fake.
rustls = { workspace = true }
# The fixture of recorded cases, which the harness reads.
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true }
# The wait between two tries of a request.
tokio = { workspace = true, features = ["time"] }
# The TLS of the harness's fake of an endpoint.
tokio-rustls = { workspace = true, optional = true }
# The line a provider logs when a request is tried again, written once here
# and logged under the provider's own target.
tracing = { workspace = true }
# The parser the client reads a URL with: named here to hold, at compile
# time, that the client's URL type is this one.
url = { workspace = true }

[dev-dependencies]
# With gzip turned on, as a host's build may turn it on for the same HTTP
# client: the tests hold that the client still asks for no compressed
# answer.
reqwest = { workspace = true, features = ["gzip"] }
# What the harness is built with, for the crate's own tests, which drive
# the client against the harness's fake.
futures-core = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync", "test-util"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true

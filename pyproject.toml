[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "roomkit-providers"
version = "0.1.0a1"
description = "RoomKit's model providers, implemented in Rust"
readme = "README.md"
requires-python = ">=3.12"
# A provider is a RoomKit provider: RoomKit's interface, models and
# exceptions. The range is the one the package is tested against.
dependencies = ["roomkit>=0.117.0.dev0,<0.118"]
# What is true of the wheel: the licenses of every crate its extension
# links, each taken under MIT where it offers it
# (`scripts/native-notices.py check` holds the expression to them).
license = "MIT AND Unicode-3.0 AND Apache-2.0 AND BSD-3-Clause AND CC0-1.0 AND CDLA-Permissive-2.0 AND ISC AND Zlib"
# The MIT license, the notice of the Unicode data two of the crates the
# extension links derive a table from, and the notices of its dependencies.
license-files = [
    "LICENSE",
    "crates/roomkit-providers-http/LICENSE-UNICODE",
    "python/roomkit_providers/licenses/native_dependencies.txt",
]
keywords = ["llm", "ai", "provider", "openai", "asyncio", "roomkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Changelog = "https://github.com/roomkit-live/roomkit-providers/blob/main/CHANGELOG.md"
Repository = "https://github.com/roomkit-live/roomkit-providers"
Issues = "https://github.com/roomkit-live/roomkit-providers/issues"


[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "roomkit_providers._native"
features = ["pyo3/extension-module"]
exclude = ["docs/**", "AGENTS.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["python/**/*.py", "tests/python/**/*.py", "examples/*.py", "benchmarks/*.py", "scripts/check-python.py", "scripts/native-notices.py", "scripts/artifact_files.py", "scripts/api-snapshot.py", "scripts/roomkit_env.py", "scripts/wheel_paths.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
